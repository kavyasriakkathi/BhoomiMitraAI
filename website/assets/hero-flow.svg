<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Flow Card 1: Farmer Input -->
  <g transform="translate(30, 80)">
    <rect width="240" height="320" rx="16" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="240" height="6" rx="3" fill="#059669"/>
    
    <!-- Step Badge -->
    <rect x="24" y="24" width="70" height="26" rx="13" fill="#dcfce7"/>
    <text x="36" y="42" font-family="'Outfit', system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">STEP 01</text>
    
    <text x="24" y="80" font-family="'Outfit', system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Farmer's Input</text>
    <text x="24" y="104" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#64748b">In their own mother tongue</text>

    <!-- Channel Pills -->
    <g transform="translate(24, 130)">
      <!-- Voice pill -->
      <rect width="192" height="42" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
      <circle cx="24" cy="21" r="12" fill="#dcfce7"/>
      <text x="20" y="25" font-size="12">🎤</text>
      <text x="46" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#334155">Voice Message (Audio)</text>

      <!-- Text pill -->
      <rect y="52" width="192" height="42" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
      <circle cx="24" cy="73" r="12" fill="#e0f2fe"/>
      <text x="20" y="77" font-size="12">💬</text>
      <text x="46" y="78" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#334155">Local Language Text</text>

      <!-- Photo pill -->
      <rect y="104" width="192" height="42" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
      <circle cx="24" cy="125" r="12" fill="#fef3c7"/>
      <text x="20" y="129" font-size="12">📷</text>
      <text x="46" y="130" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#334155">Crop & Leaf Photo</text>
    </g>
  </g>

  <!-- Connecting Line 1 -->
  <path d="M280 240 L340 240" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="340,240 332,234 332,246" fill="#10b981"/>

  <!-- Flow Card 2: BhoomiMitra Agricultural AI -->
  <g transform="translate(350, 50)">
    <rect width="250" height="360" rx="20" fill="#0f382c" filter="url(#shadow)"/>
    <rect x="0" y="0" width="250" height="6" rx="3" fill="#34d399"/>

    <!-- WhatsApp badge -->
    <rect x="24" y="24" width="116" height="26" rx="13" fill="rgba(37,211,102,0.18)"/>
    <text x="36" y="42" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#4ade80">● WHATSAPP-FIRST</text>

    <text x="24" y="82" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#ffffff">Agricultural AI</text>
    <text x="24" y="104" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">BhoomiMitra Core Engine</text>

    <!-- Processing Layers inside AI -->
    <g transform="translate(24, 128)">
      <rect width="202" height="44" rx="8" fill="#164e3d"/>
      <text x="14" y="27" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#a7f3d0">1. Multilingual Speech & Text</text>

      <rect y="52" width="202" height="44" rx="8" fill="#164e3d"/>
      <text x="14" y="79" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#a7f3d0">2. Crop Image Analysis</text>

      <rect y="104" width="202" height="44" rx="8" fill="#164e3d"/>
      <text x="14" y="131" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#a7f3d0">3. Agri Knowledge Retrieval</text>

      <rect y="156" width="202" height="44" rx="8" fill="#164e3d"/>
      <text x="14" y="183" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#fde68a">4. Safety & Shop Grounding</text>
    </g>
  </g>

  <!-- Connecting Line 2 -->
  <path d="M610 240 L670 240" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="670,240 662,234 662,246" fill="#10b981"/>

  <!-- Flow Card 3: Actionable Decision -->
  <g transform="translate(680, 80)">
    <rect width="230" height="320" rx="16" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="230" height="6" rx="3" fill="#047857"/>

    <!-- Step Badge -->
    <rect x="24" y="24" width="70" height="26" rx="13" fill="#dcfce7"/>
    <text x="36" y="42" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#166534">RESULT</text>

    <text x="24" y="80" font-family="'Outfit', sans-serif" font-size="19" font-weight="700" fill="#0f172a">Smarter Decision</text>
    <text x="24" y="104" font-family="'Inter', sans-serif" font-size="13" fill="#64748b">Clear, practical outcomes</text>

    <!-- Outcomes -->
    <g transform="translate(24, 130)">
      <rect width="182" height="42" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="14" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#166534">🌾 Clear Farming Guidance</text>

      <rect y="52" width="182" height="42" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="14" y="78" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#166534">🏪 Verified Shop & Stock</text>

      <rect y="104" width="182" height="42" rx="10" fill="#fefce8" stroke="#fef08a"/>
      <text x="14" y="130" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#854d0e">🛡️ Safety-First Advice</text>
    </g>
  </g>
</svg>
